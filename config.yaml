mechanism:
  L1: 0.20
  L2: 0.08
  L3: 0.30
  L4: 0.25
  m2: 0.5
  m3: 1.0
  m4: 0.7
  I2: 0.0005
  I3: 0.003
  I4: 0.0015

simulation:
  duration: 10.0
  timestep: 0.001
  number_of_runs: 500
  input_omega_nominal: 10.0
  input_torque_nominal: 5.0

sensors:
  noise_level: 0.01
  bias: 0.0
  sampling_frequency: 1000
  missing_samples_prob: 0.0

training:
  batch_size: 64
  epochs: 100
  learning_rate: 0.001
  validation_split: 0.15
  test_split: 0.15
  early_stopping_patience: 15
  random_seed: 42

anomaly_detection:
  threshold_percentile: 95
  window_size: 50
  stride: 10

faults:
  friction_multiplier_range: [2.0, 5.0]
  mass_multiplier_range: [1.5, 3.0]
  joint_friction_multiplier_range: [3.0, 10.0]
  inertia_multiplier_range: [2.0, 4.0]

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  models_saved: "models_saved"